name: Penerbit Instagram

# Hanya dijalankan manual (jadwal.mjs uji/cek/jalankan). Penerbitan rutin dikerjakan penjaga (jaga.yml).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'terbit | uji | cek | segarkan-token'
        required: false
        default: terbit
      post:
        description: 'id postingan untuk mode uji (pisahkan dengan koma)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: penerbit-instagram
  cancel-in-progress: false

jobs:
  terbit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Penerbit
        run: node alat/terbitkan.mjs
        env:
          MODE: ${{ inputs.mode || 'terbit' }}
          POST: ${{ inputs.post }}
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
